auto-replant:
  enabled: true
  require-seeds: true
  require-tool: false
  delay-ticks: 1
right-click-harvest:
  enabled: true
  require-tool: false
tools:
  enabled-tools:
  - minecraft:wooden_hoe
  - minecraft:stone_hoe
  - minecraft:iron_hoe
  - minecraft:golden_hoe
  - minecraft:diamond_hoe
  - minecraft:netherite_hoe
  required-item-models: []
  custom-item:
    enabled: false
    custom-name: <yellow>收获镰刀</yellow>
    lore:
    - <white>右键收获成熟作物</white>
    - <green>补种消耗背包中的种子</green>
    item-type: WOODEN_HOE
    item-model: ''
