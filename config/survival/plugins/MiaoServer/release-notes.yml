version: '0.9.26'
summary: '称号、社区与丰饶矿界'
lines:
  - '&e称号殿堂：77 个预设，自定义每个 100,000 金币。'
  - '&b社区生活：地标自动发布、悬赏板、每日委托与个人小报。'
  - '&a矿界连片矿脉，门票 200 金币，三个维度共用。'
  - '&7矿界全组和平、死亡不掉落；每 3 天 04:00 换种重置。'
  - '&d奇珍阁：不损坏工具与闪耀之翼，高价金币购买。'
  - '&6工具三档100万/1000万/1亿；光源方块每组50万，闪耀之翼10亿。'
  - '&a提高部分回收价，修复出售窗口被立即关闭的问题。'
  - '&7OP 登录后可维护普通出生点，主城仍禁止破坏。'
  - '&b手机默认发送视距8格，PC与模拟距离保持原设置。'
