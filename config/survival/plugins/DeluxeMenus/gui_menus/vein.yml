menu_title: '&8连锁挖矿'
open_command:
- vein-menu
size: 27
items:
  toggle:
    material: IRON_PICKAXE
    slot: 10
    display_name: '&a连锁挖矿开关'
    lore:
    - '&7开启 / 关闭自己的连锁挖矿'
    - '&7只连同类矿石，最多 32 块'
    - '&7正常消耗耐久与饥饿，遵守领地权限'
    left_click_commands:
    - '[close]'
    - '[player] veinminer toggle'
    right_click_commands:
    - '[close]'
    - '[player] veinminer toggle'
  sneak:
    material: LEATHER_BOOTS
    slot: 12
    display_name: '&b蹲下触发'
    lore:
    - '&7PC 按住 Shift，PE 点击潜行'
    - '&7蹲下挖矿时才触发连锁'
    left_click_commands:
    - '[close]'
    - '[player] veinminer mode sneak'
    right_click_commands:
    - '[close]'
    - '[player] veinminer mode sneak'
  always:
    material: REDSTONE_TORCH
    slot: 14
    display_name: '&e自动触发'
    lore:
    - '&7开关处于开启状态时，挖矿自动连锁'
    - '&7手机玩家无需一直潜行'
    - '&7不在主城 / 创造世界生效'
    left_click_commands:
    - '[close]'
    - '[player] veinminer mode always'
    right_click_commands:
    - '[close]'
    - '[player] veinminer mode always'
  back:
    material: ARROW
    slot: 22
    display_name: '&f返回工具箱'
    lore:
    - '&7回到生电与挖矿工具'
    left_click_commands:
    - '[openguimenu] technical'
    right_click_commands:
    - '[openguimenu] technical'
