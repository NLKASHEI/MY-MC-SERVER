menu_title: '&8领地管家'
open_command:
- claims-menu
size: 36
items:
  tutorial:
    material: GOLDEN_SHOVEL
    slot: 11
    display_name: '&e金铲圈地教程'
    lore:
    - '&7金铲右键两个立体对角点'
    - '&7长、宽、高每边最多 25 格'
    - '&f点击查看详细说明'
    left_click_commands:
    - '[close]'
    - '[player] miao land help'
    right_click_commands:
    - '[close]'
    - '[player] miao land help'
  quick:
    material: OAK_FENCE
    slot: 12
    display_name: '&a确认创建选区'
    lore:
    - '&7先用金铲选择两个对角点'
    - '&7绿色粒子范围仅自己可见'
    - '&f点击创建严格立体保护'
    left_click_commands:
    - '[close]'
    - '[player] miao land create'
    right_click_commands:
    - '[close]'
    - '[player] miao land create'
  list:
    material: MAP
    slot: 13
    display_name: '&b我的立体领地'
    lore:
    - '&7查看自己拥有的立体领地'
    left_click_commands:
    - '[close]'
    - '[player] miao land list'
    right_click_commands:
    - '[close]'
    - '[player] miao land list'
  teams:
    material: CAMPFIRE
    slot: 14
    display_name: '&6队伍共享领地'
    lore:
    - '&7邀请伙伴共同建造、使用箱子'
    - '&7领地所有权仍归地主，成员不能再授权'
    left_click_commands:
    - '[openguimenu] teams'
    right_click_commands:
    - '[openguimenu] teams'
  trapped:
    material: ENDER_PEARL
    slot: 15
    display_name: '&b脱困帮助'
    lore:
    - '&7被困在他人的圈地内时使用'
    - '&7按提示原地等待，不要移动'
    left_click_commands:
    - '[close]'
    - '[player] trapped'
    right_click_commands:
    - '[close]'
    - '[player] trapped'
  trust:
    material: PLAYER_HEAD
    slot: 20
    display_name: '&f好友建造授权'
    lore:
    - '&7允许好友建造和使用容器'
    - '&7先站在要授权的圈地内'
    left_click_commands:
    - '[close]'
    - '[player] miao land trusthelp'
    right_click_commands:
    - '[close]'
    - '[player] miao land trusthelp'
  access:
    material: OAK_DOOR
    slot: 21
    display_name: '&f申请更大领地'
    lore:
    - '&7选中超过 25 格的立体范围'
    - '&7点击提交，需 OP 批准后创建'
    left_click_commands:
    - '[close]'
    - '[player] miao land request'
    right_click_commands:
    - '[close]'
    - '[player] miao land request'
  trustlist:
    material: PAPER
    slot: 22
    display_name: '&e查看授权名单'
    lore:
    - '&7先站在要查看的圈地内'
    left_click_commands:
    - '[close]'
    - '[player] miao land info'
    right_click_commands:
    - '[close]'
    - '[player] miao land info'
  untrust:
    material: IRON_DOOR
    slot: 23
    display_name: '&6撤销好友授权'
    lore:
    - '&7撤销指定玩家的圈地权限'
    left_click_commands:
    - '[close]'
    - '[player] miao land untrusthelp'
    right_click_commands:
    - '[close]'
    - '[player] miao land untrusthelp'
  abandon:
    material: BARRIER
    slot: 24
    display_name: '&c放弃当前圈地'
    lore:
    - '&7解除当前位置的土地保护'
    - '&c需要再次确认，不会删除建筑'
    left_click_commands:
    - '[close]'
    - '[player] claim-confirm'
    right_click_commands:
    - '[close]'
    - '[player] claim-confirm'
  back:
    material: ARROW
    slot: 31
    display_name: '&f返回玩家中心'
    lore:
    - '&7回到指南针主菜单'
    left_click_commands:
    - '[close]'
    - '[player] menu'
    right_click_commands:
    - '[close]'
    - '[player] menu'
  heading:
    material: BOOK
    slot: 4
    display_name: '&b&l领地管家'
    lore:
    - '&7上排：选区、领地与伙伴'
    - '&7下排：授权管理与放弃领地'
    left_click_commands: []
    right_click_commands: []
