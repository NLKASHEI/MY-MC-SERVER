    - '&7不足 3 份的余数保留到下次'
    - '&7普通石头、泥土和带入物资不收费'
    - '&7退出显示结算，不再扣一次背包'
    - '&c每 3 天凌晨 4 点重置并换随机种子'
    - '&c不要建家！建筑、箱子和地上物品会清空'
    - '&7时间按北京时间，重置前会提醒并送回生存'
