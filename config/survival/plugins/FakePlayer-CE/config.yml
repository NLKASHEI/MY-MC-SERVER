version: 24
i18n:
  locale: zh
server-limit: 20
player-limit: 5
detect-ip: false
name-template: ''
name-prefix: Bot_
name-pattern: ^[a-zA-Z0-9_]+$
name-style: gray, italic
lifespan: 0
persistent-data: true
restore-on-start: false
follow-quiting: true
follow-quiting-force: true
follow-quiting-force-delay: 15
drop-inventory-on-quiting: false
kick-on-dead: true
prevent-kicking: NEVER
forced-execution: false
kale-tps: 0
pre-spawn-commands:
- survivalbotprepare %u %c
post-spawn-commands:
- ''
- ''
after-spawn-commands:
- lp user %u permission set survival.dummy true
- survivalbotrestore %p
self-commands:
- ''
- ''
post-quit-commands:
- ''
- ''
after-quit-commands:
- ''
- ''
default-features:
  collidable: true
  pickup_items: true
  skin: true
  look_at_entity: false
  invulnerable: false
  replenish: false
  replace_tools: false
  autofish: false
  wolverine: false
replenish:
  tools:
    durability-threshold: 0
tool-replacement:
  remaining-durability-threshold: 10
invsee-implement: AUTO
allow-non-op-open-inv: true
custom-ping: ''
custom-ping-dynamic: false
custom-ping-dynamic-interval: 200
auto-login: false
register: /reg %password% %password%
login: /login %password%
random-password: ''
random-password-length: 12
change-password: /changepassword %oldpassword% %newpassword% %newpassword%
check-for-updates: false
http-admin:
  enabled: false
  host: 0.0.0.0
  port: 3253
  token: ''
  allow-get: true
  allowed-hosts: []
  rate-limit:
    requests-per-minute: 120
    auth-failures: 10
    lockout-seconds: 60
  interface:
    list: true
    status: true
    info: true
    spawn: true
    kick: true
    kill: true
    respawn: true
    action: true
    stop: true
    say: true
    teleport: true
    look: true
    hold: true
    swap: true
    cmd: true
    batch: true
