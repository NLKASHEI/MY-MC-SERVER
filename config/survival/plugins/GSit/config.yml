Lang:
  lang: zh_cn
  client-lang: false
Options:
  check-for-update: true
  get-up-damage: false
  get-up-sneak: true
  get-up-return: false
  get-up-break: true
  allow-unsafe: false
  same-block-rest: false
  center-block: true
  custom-message: true
  Sit:
    SitMaterials:
    - '#stairs'
    - '#slabs'
    - '#carpets'
    - '#wool_carpets'
    - moss_carpet
    - pale_moss_carpet
    - shelf_mushroom
    - snow
    bottom-part-only: true
    empty-hand-only: true
    max-distance: 3.0
    default-sit-mode: true
  PlayerSit:
    allow-sit: true
    allow-sit-npc: false
    max-stack: 3
    sneak-ejects: true
    bottom-return: false
    empty-hand-only: true
    max-distance: 3.0
    default-sit-mode: true
  Pose:
    interact: false
    lay-rest: true
    lay-snoring-sounds: false
    lay-snoring-night-only: true
    lay-night-skip: true
  Crawl:
    get-up-sneak: true
    corridor-crawl: true
    double-sneak: false
    double-sneak-pitch: 75
    double-sneak-time: 400
    default-crawl-mode: true
    layers: 1
  trusted-region-only: false
  WorldBlacklist: []
  WorldWhitelist: []
  MaterialBlacklist: []
  CommandBlacklist:
  - skin
  - nick
  FeatureFlags: []
