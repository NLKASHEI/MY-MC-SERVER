name: Validate server source
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell and manifests
        shell: powershell
        run: ./scripts/validate.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate YAML templates
        run: python -c "import pathlib,yaml; files=list(pathlib.Path('config').rglob('*.yml')); [yaml.safe_load(p.read_text(encoding='utf-8-sig')) for p in files]; print(f'{len(files)} YAML templates parsed')"
