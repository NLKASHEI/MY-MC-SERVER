name: Validate server source
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell and manifests
        shell: pwsh
        run: ./scripts/validate.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate YAML templates
        run: python tests/validate-config.py
