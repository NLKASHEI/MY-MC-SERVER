name: MiaoServer
prefix: NLK
version: 0.9.9
main: cn.nankexi.MiaoServer
api-version: '26.2'
depend: [GriefPrevention, AuthMe, floodgate, WorldEdit, WorldGuard, Vault]
loadbefore: [Backuper, DeluxeMenus, VeinMiner, AuraSkills, EconomyShopGUI]
commands:
  land:
    description: 立体领地与扩大申请
    permission: survival.claims
  mteam:
    aliases: [team]
    description: 中文组队与共享领地
    permission: survival.team
  sidebar:
    description: 开关中文侧边栏
    permission: survival.team
  miao:
    description: NLK 服务中心
    permission: survival.guide
  accountlink:
    description: 中文双端绑定流程
    permission: floodgate.command.linkaccount
permissions:
  survival.claims:
    default: true
  survival.team:
    default: true
  miao.compass.teleport:
    default: op
