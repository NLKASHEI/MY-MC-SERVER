name: MiaoServer
version: 0.9.1
main: cn.nankexi.MiaoServer
api-version: '26.2'
depend: [GriefPrevention, AuthMe, floodgate, WorldEdit, Vault]
loadbefore: [Backuper, DeluxeMenus]
commands:
  mteam:
    aliases: [team]
    description: 中文组队与共享领地
    permission: survival.team
  sidebar:
    description: 开关中文侧边栏
    permission: survival.team
  miao:
    description: 妙妙服服务中心
    permission: survival.guide
  accountlink:
    description: 中文双端绑定流程
    permission: floodgate.command.linkaccount
permissions:
  survival.team:
    default: true
  miao.compass.teleport:
    default: op
