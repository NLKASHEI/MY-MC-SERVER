name: MiaoServer
prefix: NLK
version: 0.9.27
main: cn.nankexi.MiaoServer
api-version: '26.2'
depend: [GriefPrevention, AuthMe, floodgate, WorldEdit, WorldGuard, Vault, Scythe, Multiverse-Core, Multiverse-Inventories]
softdepend: [FakePlayer-CE, ViaVersion, SkinsRestorer, PlaceholderAPI]
loadbefore: [Backuper, DeluxeMenus, VeinMiner, AuraSkills, EconomyShopGUI, BlueMap]
commands:
  communityadmin:
    description: 社区交付核对
    permission: miao.community.admin
  titles:
    description: 称号殿堂、里程碑补发与称号商店
    aliases: [chenghao]
  titleadmin:
    description: 称号授予和购买核对
    permission: miao.titles.admin
  packetallow:
    description: 管理 ViaVersion 单人发包豁免
    permission: miao.packetallow.admin
  land:
    description: 立体领地与扩大申请
    permission: survival.claims
  mteam:
    aliases: [team]
    description: 中文组队与共享领地
    permission: survival.team
  sidebar:
    description: 开关中文侧边栏
    permission: survival.team
  miao:
    description: NLK 服务中心
    permission: survival.guide
  accountlink:
    description: 中文双端绑定流程
    permission: floodgate.command.linkaccount
permissions:
  miao.community.admin:
    default: op
  miao.titles.admin:
    default: op
  survival.claims:
    default: true
  survival.team:
    default: true
  miao.compass.teleport:
    default: op
  miao.packetallow.admin:
    description: 管理单人发包豁免名单
    default: op
